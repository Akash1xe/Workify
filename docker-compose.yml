services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_password}
      POSTGRES_DB: sentinel_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-org-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_password}
    volumes:
      - ./infrastructure/postgres/init:/scripts:ro
    command: ["sh", "-c", "for file in /scripts/*.sql; do psql -h postgres -U sentinel -d sentinel_auth -f \"$$file\"; done"]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sentinel.telemetry.logs.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sentinel.telemetry.metrics.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sentinel.telemetry.events.v1 --partitions 3 --replication-factor 1

  auth-service:
    build: ./services/auth-service
    environment:
      NODE_ENV: development
      PORT: 4001
      DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD:-sentinel_dev_password}@postgres:5432/sentinel_auth?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-access-secret-change-me-123456}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development-refresh-secret-change-me-12345}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:4000}
      BCRYPT_ROUNDS: 12
      COOKIE_SECURE: "false"
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  organization-service:
    build: ./services/organization-service
    environment:
      NODE_ENV: development
      PORT: 4002
      DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD:-sentinel_dev_password}@postgres:5432/sentinel_org?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-access-secret-change-me-123456}
      JWT_ISSUER: sentinelai-auth
      JWT_AUDIENCE: sentinelai-api
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:4000}
    ports:
      - "4002:4002"
    depends_on:
      postgres-org-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  service-catalog-service:
    build: ./services/service-catalog-service
    environment:
      NODE_ENV: development
      PORT: 4003
      DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD:-sentinel_dev_password}@postgres:5432/sentinel_catalog?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-access-secret-change-me-123456}
      JWT_ISSUER: sentinelai-auth
      JWT_AUDIENCE: sentinelai-api
      ORGANIZATION_SERVICE_URL: http://organization-service:4002
      MEMBERSHIP_TIMEOUT_MS: ${MEMBERSHIP_TIMEOUT_MS:-3000}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-development-internal-service-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:4000}
    ports:
      - "4003:4003"
    depends_on:
      postgres-org-init:
        condition: service_completed_successfully
      organization-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  incident-service:
    build: ./services/incident-service
    environment:
      NODE_ENV: development
      PORT: 4004
      DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD:-sentinel_dev_password}@postgres:5432/sentinel_incident?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-access-secret-change-me-123456}
      JWT_ISSUER: sentinelai-auth
      JWT_AUDIENCE: sentinelai-api
      ORGANIZATION_SERVICE_URL: http://organization-service:4002
      CATALOG_SERVICE_URL: http://service-catalog-service:4003
      DEPENDENCY_TIMEOUT_MS: ${DEPENDENCY_TIMEOUT_MS:-3000}
      REDIS_URL: redis://redis:6379
      REALTIME_PUBLISH_TIMEOUT_MS: ${REALTIME_PUBLISH_TIMEOUT_MS:-500}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:4000}
    ports:
      - "4004:4004"
    depends_on:
      postgres-org-init:
        condition: service_completed_successfully
      organization-service:
        condition: service_healthy
      service-catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4004/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  realtime-service:
    build: ./services/realtime-service
    environment:
      NODE_ENV: development
      PORT: 4005
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-access-secret-change-me-123456}
      JWT_ISSUER: sentinelai-auth
      JWT_AUDIENCE: sentinelai-api
      ORGANIZATION_SERVICE_URL: http://organization-service:4002
      INCIDENT_SERVICE_URL: http://incident-service:4004
      DEPENDENCY_TIMEOUT_MS: ${DEPENDENCY_TIMEOUT_MS:-3000}
      CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "4005:4005"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4005/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestion-service:
    build: ./services/ingestion-service
    environment:
      NODE_ENV: development
      PORT: 4006
      SERVICE_CATALOG_URL: http://service-catalog-service:4003
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-development-internal-service-secret-change-me}
      DEPENDENCY_TIMEOUT_MS: ${DEPENDENCY_TIMEOUT_MS:-3000}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: sentinel-ingestion-service
      KAFKA_RETRY_INTERVAL_MS: 3000
      REDIS_URL: redis://redis:6379
      SERVICE_RATE_LIMIT: 100
      SERVICE_RATE_WINDOW_SECONDS: 1
      BODY_LIMIT: 2mb
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:4000}
    ports:
      - "4006:4006"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      service-catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4006/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build: ./services/api-gateway
    environment:
      NODE_ENV: development
      PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:4001
      ORGANIZATION_SERVICE_URL: http://organization-service:4002
      CATALOG_SERVICE_URL: http://service-catalog-service:4003
      INCIDENT_SERVICE_URL: http://incident-service:4004
      INGESTION_SERVICE_URL: http://ingestion-service:4006
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_WINDOW_SECONDS: 60
      CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: "false"
    ports:
      - "4000:4000"
    depends_on:
      auth-service:
        condition: service_healthy
      organization-service:
        condition: service_healthy
      service-catalog-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
